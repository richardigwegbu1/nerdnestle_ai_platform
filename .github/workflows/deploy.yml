name: Deploy to EC2 (Amazon Linux)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Backend & Frontend to EC2
    runs-on: ubuntu-latest

    steps:
      # -------------------------------
      # 1. Checkout Code
      # -------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------
      # 2. Configure SSH Key
      # -------------------------------
      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # -------------------------------
      # 3. Test SSH Connection
      # -------------------------------
      - name: Test SSH connectivity
        run: |
          ssh -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "echo 'SSH OK'"

      # -------------------------------
      # 4. Deploy to EC2
      # -------------------------------
      - name: Deploy and restart services on EC2
        run: |
          ssh -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} << 'EOF'

          # Navigate to project
          cd /home/ec2-user/nerdnest_ai_platform || exit 1

          echo "📥 Pulling latest code..."
          git reset --hard
          git pull origin main

          # ---------------- Backend ----------------
          echo "📦 Updating backend..."
          cd backend
          source .venv/bin/activate
          pip install -r requirements.txt

          echo "🔄 Restarting backend service..."
          sudo systemctl restart nerdnestle-api.service

          # ---------------- Frontend ----------------
          echo "🌐 Updating frontend..."
          cd ../frontend
          npm install
          npm run build

          echo "🚀 Restarting PM2..."
          pm2 reload pm2-frontend.config.js || pm2 start pm2-frontend.config.js
          pm2 save

          echo "✅ Deployment completed successfully."
          EOF


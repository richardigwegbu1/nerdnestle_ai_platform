name: Deploy Frontend (Next.js + PM2)

on:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy frontend to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh ${EC2_USER}@${EC2_HOST} << 'EOF'
            set -e

            cd /home/ec2-user/nerdnest_ai_platform

            echo "🔁 Pulling latest code from Git..."
            git pull origin main

            echo "📦 Building Next.js frontend..."
            cd frontend

            # Install dependencies (or npm ci if you prefer)
            npm install

            # Build production bundle
            npm run build

            echo "♻️ Reloading PM2 frontend process..."
            # If you used pm2-frontend.config.js earlier:
            pm2 start pm2-frontend.config.js --env production || pm2 restart frontend
            pm2 save

            echo "✅ Frontend deploy finished."
          EOF


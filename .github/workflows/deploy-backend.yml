name: Deploy Backend (FastAPI)

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy backend to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh ${EC2_USER}@${EC2_HOST} << 'EOF'
            set -e

            cd /home/ec2-user/nerdnest_ai_platform

            echo "🔁 Pulling latest code from Git..."
            git pull origin main

            echo "📦 Updating backend dependencies..."
            cd backend
            source .venv/bin/activate
            pip install -r requirements.txt

            echo "🚀 Restarting FastAPI backend service..."
            sudo systemctl restart nerdnestle-api.service
            sudo systemctl status nerdnestle-api.service --no-pager --lines=5 || true

            echo "✅ Backend deploy finished."
          EOF

